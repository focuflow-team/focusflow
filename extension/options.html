<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow Blocker — 설정</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🎯</span>
        <h1 class="logo-text">FocusFlow Blocker 설정</h1>
      </div>
    </header>

    <main class="main">
      <!-- Blocked sites management -->
      <section class="section">
        <h2 class="section-title">차단 사이트 목록</h2>
        <p class="section-desc">집중 모드 활성화 시 차단할 사이트 도메인을 관리합니다.</p>

        <div class="add-site">
          <input
            type="text"
            id="new-site-input"
            placeholder="예: example.com"
            class="site-input"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="add-site-btn" class="btn btn-primary">추가</button>
        </div>

        <ul class="sites-list" id="sites-list"></ul>
      </section>

      <!-- Sync settings -->
      <section class="section">
        <h2 class="section-title">웹앱 동기화</h2>
        <p class="section-desc">FocusFlow 웹앱 타이머와 자동으로 동기화합니다.</p>

        <label class="checkbox-label">
          <input type="checkbox" id="auto-sync-checkbox" />
          <span>웹앱 타이머 시작 시 자동으로 차단 활성화</span>
        </label>

        <label class="checkbox-label" style="margin-top: 8px;">
          <input type="checkbox" id="auto-stop-checkbox" />
          <span>웹앱 타이머 종료 시 자동으로 차단 비활성화</span>
        </label>
      </section>

      <!-- Reset to defaults -->
      <section class="section">
        <h2 class="section-title">초기화</h2>
        <button id="reset-btn" class="btn btn-danger">기본 차단 목록으로 초기화</button>
      </section>

      <div class="save-status" id="save-status"></div>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
