<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>집중 모드 중 — FocusFlow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      max-width: 420px;
      padding: 48px 32px;
      background: #1e293b;
      border-radius: 20px;
      border: 1px solid #334155;
    }

    .icon {
      font-size: 56px;
      margin-bottom: 20px;
      display: block;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .domain {
      display: inline-block;
      background: #0f172a;
      border-radius: 6px;
      padding: 4px 12px;
      font-family: monospace;
      font-size: 14px;
      color: #f87171;
      margin: 8px 0 16px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-back {
      display: inline-block;
      padding: 10px 24px;
      background: none;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-back:hover {
      border-color: #94a3b8;
      color: #f1f5f9;
    }

    .quote {
      margin-top: 24px;
      font-size: 13px;
      color: #475569;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🎯</span>
    <h1>집중 모드 활성화 중</h1>
    <p>현재 이 사이트는 차단되어 있습니다.</p>
    <span class="domain" id="blocked-domain">-</span>
    <p>집중 세션이 끝난 후 방문할 수 있습니다.</p>

    <div class="actions">
      <a href="javascript:history.back()" class="btn-back">← 이전 페이지로</a>
    </div>

    <p class="quote">"집중은 아니오라고 말하는 것이다." — 스티브 잡스</p>
  </div>

  <script>
    // Show the blocked domain from the referrer
    try {
      const params = new URLSearchParams(location.search);
      const ref = params.get('ref') || document.referrer;
      if (ref) {
        const url = new URL(ref);
        document.getElementById('blocked-domain').textContent = url.hostname;
      }
    } catch {
      // ignore
    }
  </script>
</body>
</html>
